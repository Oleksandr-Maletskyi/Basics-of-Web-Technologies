<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Картка — практична CSS</title>
  <link rel="stylesheet" href="card.css">
</head>
<body>

  <!--
    Варіант контенту визначається викладачем.
    Структура (теги, класи) однакова для всіх варіантів —
    змінюється тільки контент усередині.

    Варіант A — Картка ТОВАРУ
    Варіант B — Картка ПРОФІЛЮ +
    Варіант C — Картка СТАТТІ
    Варіант D — Картка КУРСУ
  -->

  <article class="card">
    <img class="card-image"
         src="cristiano-ronaldo-por-portugal.jpg"
         alt="Зображення для картки">

    <h3 class="card-title">cri.ro7.fan</h3>

    <p class="card-meta">
      Фан-акаунт Кріштіано Роналду
    </p>

    <p class="card-description">
      Тут едіти з Роналду
    </p>

    <p class="card-price">1 251 452 підписники</p>

    <button class="card-action" type="button">
      Дізнатися більше
    </button>
  </article>

</body>
</html>
