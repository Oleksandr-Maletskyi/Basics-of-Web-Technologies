<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>My Page</title>


    <link rel="stylesheet" type="text/css" href="main.css" />
</head>
<body>
    <main class="main-container">
        <div class="items-list" id="items-list-container">

            <div class="add-item-form">
                <input type="text" class="item-input" id="new-item-input" placeholder="Назва товару">
                <button class="add-btn" id="add-item-btn" data-tooltip="Додати">Додати</button>
            </div>

            <div class="item-row">
                <div class="item-name2">Яблуко</div>
                <div class="item-amount-controls">
                    <span class="amount">4</span>
                </div>
                <div class="item-actions">
                    <button class="status-btn not-bought" data-tooltip="Не куплено">Не куплено</button>
                </div>
            </div>

            <div class="item-row">
                <div class="item-name">Печиво</div>
                <div class="item-amount-controls">
                    <button class="btn-minus" data-tooltip="Зменшити">-</button>
                    <span class="amount">2</span>
                    <button class="btn-plus" data-tooltip="Збільшити">+</button>
                </div>
                <div class="item-actions">
                    <button class="status-btn bought" data-tooltip="Куплено">Куплено</button>
                    <button class="btn-delete" data-tooltip="Видалити">✖</button>
                </div>
            </div>
        </div>

        <div class="item-koshik">
            <div class="status-zal">Залишилося</div>
            <div id="stats-left">
                <div class="zal">
                    <span class="status-name">Печиво</span>
                    <span class="status-amount">2</span>
                </div>
            </div>

            <div class="status-kup">Куплено</div>
            <div id="stats-bought">
                <div class="kup">
                    <span class="status-name2">Яблуко</span>
                    <span class="status-amount">4</span>
                </div>
            </div>  
        </div>

        <div class="author-badge">
            <span class="badge-title">Buy List</span>
            <span class="badge-author">Created by:<br>Олександр Малецький</span>
        </div>
    </main>
    <script src="main.js"></script>
</body>
</html>
