<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Task 5 — Пошук країн</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 2rem auto; padding: 1rem; line-height: 1.5; }
    h1 { color: #2050a0; }
    #search { width: 100%; padding: 10px; font-size: 1.1rem; border: 1px solid #ccd; border-radius: 6px; margin-bottom: 1rem; }
    #status { color: #888; font-size: 0.9em; min-height: 1.2em; margin-bottom: 0.5rem; }
    #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .country { background: #f6f8fa; padding: 1rem; border-radius: 6px; }
    .country .flag { font-size: 2.5rem; }
    .country h3 { margin: 0.3rem 0; color: #2050a0; }
    .country .meta { color: #555; font-size: 0.9em; }
  </style>
</head>
<body>

  <h1>Пошук країн</h1>
  <input id="search" type="text" placeholder="Введіть назву країни (мін. 2 символи)...">
  <p id="status"></p>
  <div id="results"></div>

  <script src="search.js"></script>
</body>
</html>
