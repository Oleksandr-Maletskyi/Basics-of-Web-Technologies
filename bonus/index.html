<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Саперs</title>
    <link href="https://cdn.webdatarocks.com/latest/webdatarocks.min.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
    <script src="https://cdn.webdatarocks.com/latest/webdatarocks.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2b2b2b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            margin: 0;
            user-select: none;
        }
        h1 { margin-bottom: 20px; }
        
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            color: white;
            font-weight: bold;
        }
        
        #flagToggle { background-color: #4CAF50; }
        #restartBtn { background-color: #2196F3; }

        #wdr-component {
            width: 450px; 
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <h1>Сапер</h1>

    <div class="controls">
        <button id="flagToggle" class="btn">Режим: Копати</button>
        <button id="restartBtn" class="btn">Почати заново</button>
    </div>

    <div id="wdr-component"></div>

    <script src="script.js"></script>

</body>
</html>
